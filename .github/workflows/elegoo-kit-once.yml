name: Apply Elegoo Kit filter

on:
  push:
    branches: [esp-lab-v1]
    paths:
      - .github/workflows/elegoo-kit-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esp-lab-v1
          fetch-depth: 0

      - name: Add Elegoo Kit filter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('frontend/src/components/ComponentPickerModal.tsx')
          text = path.read_text()

          anchor = "const KEY_RECENT = 'recent';\n"
          addition = """const KEY_ELEGOO = 'elegoo';\n\n// Components that match the classroom Elegoo ESP32 kit. The full component\n// library remains available; this set only powers a convenient picker filter.\n// Missing kit parts (for example DHT11) can be added here once they have a\n// real simulator implementation instead of substituting a different part.\nconst ELEGOO_COMPONENT_IDS = new Set([\n  'led',\n  'rgb-led',\n  'resistor',\n  'resistor-220',\n  'resistor-330',\n  'resistor-1k',\n  'resistor-10k',\n  'pushbutton',\n  'pushbutton-6mm',\n  'slide-switch',\n  'tilt-switch',\n  'potentiometer',\n  'buzzer',\n  'servo',\n  'hc-sr04',\n  'analog-joystick',\n  'pir-motion-sensor',\n  'photoresistor-sensor',\n  'ssd1306',\n  'ssd1306-i2c-4pin',\n  'membrane-keypad',\n  'stepper-motor',\n  'motor-driver-l293d',\n  'relay',\n  '7segment',\n  'mpu6050',\n  'ntc-temperature-sensor',\n  'ir-receiver',\n  'ir-remote',\n  'bjt-2n2222',\n]);\n"
          if 'const KEY_ELEGOO' not in text:
              if anchor not in text:
                  raise SystemExit('KEY_RECENT anchor not found')
              text = text.replace(anchor, anchor + addition, 1)

          old = """function inSelection(component: ComponentMetadata, selectedKey: string): boolean {\n  if (!selectedKey.startsWith('cat:')) return true;\n  const [cat, sub] = selectedKey.slice(4).split('/');\n  if (normalizeCategory(component.category) !== cat) return false;\n  return !sub || subcategoryOf(component) === sub;\n}\n"""
          new = """function inSelection(component: ComponentMetadata, selectedKey: string): boolean {\n  if (selectedKey === KEY_ELEGOO) return ELEGOO_COMPONENT_IDS.has(component.id);\n  if (!selectedKey.startsWith('cat:')) return true;\n  const [cat, sub] = selectedKey.slice(4).split('/');\n  if (normalizeCategory(component.category) !== cat) return false;\n  return !sub || subcategoryOf(component) === sub;\n}\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'selectedKey === KEY_ELEGOO' not in text:
              raise SystemExit('inSelection anchor not found')

          old_head = """    const head: TreeNode[] = [\n      { key: KEY_ALL, label: t('editor.componentPicker.allComponents'), count: baseComponents.length },\n    ];\n"""
          new_head = """    const head: TreeNode[] = [\n      { key: KEY_ALL, label: t('editor.componentPicker.allComponents'), count: baseComponents.length },\n      {\n        key: KEY_ELEGOO,\n        label: t('editor.componentPicker.elegooKit', 'Elegoo Kit'),\n        count: baseComponents.filter((c) => ELEGOO_COMPONENT_IDS.has(c.id)).length,\n      },\n    ];\n"""
          if old_head in text:
              text = text.replace(old_head, new_head, 1)
          elif "componentPicker.elegooKit" not in text:
              raise SystemExit('tree head anchor not found')

          path.write_text(text)

          translations = {
              'en': 'Elegoo Kit',
              'no': 'Elegoo-sett',
              'pl': 'Zestaw Elegoo',
              'uk': 'Набір Elegoo',
          }
          for locale, label in translations.items():
              p = Path(f'frontend/src/i18n/locales/{locale}/common2.json')
              data = json.loads(p.read_text())
              data.setdefault('editor', {}).setdefault('componentPicker', {})['elegooKit'] = label
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          doc = Path('docs/ESP-LAB-V1.md')
          if doc.exists():
              d = doc.read_text()
              note = '\n## Elegoo component menu\n\nESP-Lab keeps the complete original component library. A dedicated **Elegoo Kit** filter highlights the components from the classroom kit that are already genuinely simulated. Missing kit parts are added only when a matching simulator implementation exists; substitutes are not presented as the original part.\n'
              if '## Elegoo component menu' not in d:
                  doc.write_text(d.rstrip() + '\n' + note)

          # This workflow is intentionally one-shot. Remove it from the branch
          # in the same commit that contains the generated changes.
          Path('.github/workflows/elegoo-kit-once.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Elegoo Kit component filter"
          git push origin HEAD:esp-lab-v1
